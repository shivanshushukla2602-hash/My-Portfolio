<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyCosmos — In-Browser Python WASM Compiler & Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bg-base: #080B10;
            --bg-surface: #101520;
            --bg-card: #151C2C;
            --border: rgba(255, 255, 255, 0.08);
            --text-primary: #F4F1EA;
            --text-secondary: #9BA3B5;
            --text-muted: #647087;
            --py-blue: #38BDF8;
            --py-yellow: #FCD34D;
            --font-main: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.1rem 2rem;
            background: rgba(16, 21, 32, 0.9);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #0284C7, #F59E0B);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.2rem;
        }

        .brand-text h1 { font-size: 1.15rem; font-weight: 800; }
        .brand-text span { font-size: 0.7rem; color: var(--py-yellow); font-family: var(--font-mono); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .btn-link {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            padding: 0.4rem 0.85rem;
            border-radius: 9999px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-live {
            background: #F4F1EA;
            color: #000;
            font-weight: 700;
        }

        .btn-live:hover { background: #fff; transform: translateY(-1px); }

        .btn-repo {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-repo:hover { border-color: rgba(255, 255, 255, 0.25); }

        .main-frame-wrapper {
            flex: 1;
            width: 100%;
            height: calc(100vh - 65px);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .fallback-banner {
            position: absolute;
            bottom: 1.5rem;
            right: 1.5rem;
            background: rgba(16, 21, 32, 0.95);
            border: 1px solid var(--border);
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <header>
        <a href="https://pycosmos.vercel.app" target="_blank" rel="noopener noreferrer" class="brand">
            <div class="brand-icon"><i class="bi bi-asterisk"></i></div>
            <div class="brand-text">
                <h1>PyCosmos</h1>
                <span>CPYTHON 3.12 WASM · 51 CURRICULUM TOPICS</span>
            </div>
        </a>
        <div class="header-actions">
            <a href="https://pycosmos.vercel.app" target="_blank" rel="noopener noreferrer" class="btn-link btn-live">
                <i class="bi bi-box-arrow-up-right"></i>
                <span>Open PyCosmos App</span>
            </a>
            <a href="https://github.com/shivanshushukla2602-hash/PyCosmos" target="_blank" rel="noopener noreferrer" class="btn-link btn-repo">
                <i class="bi bi-github"></i>
                <span>GitHub Repository</span>
            </a>
        </div>
    </header>

    <div class="main-frame-wrapper">
        <iframe src="https://pycosmos.vercel.app" title="PyCosmos Live Platform" loading="eager" allow="clipboard-write"></iframe>
        <div class="fallback-banner">
            <span>Client-side WebAssembly execution powered by Pyodide.</span>
            <a href="https://pycosmos.vercel.app" target="_blank" style="color:var(--py-blue); text-decoration:none; font-weight:600;">Launch Fullscreen &rarr;</a>
        </div>
    </div>
</body>
</html>
